[package]
name = "tip-jar"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.7"

[dev-dependencies]
mollusk-svm = "0.16"
mollusk-svm-programs-token = "0.16"
solana-account = "4"
solana-instruction = "*"
solana-program-error = "*"
solana-pubkey = { version = "4", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
